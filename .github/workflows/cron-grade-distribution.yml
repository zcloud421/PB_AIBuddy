name: Grade Distribution Check

on:
  schedule:
    # UTC 12:30 = HKT 20:30. Phase 5.0 baseline alert after daily screener data is expected in DB.
    - cron: '30 12 * * *'
  workflow_dispatch:

jobs:
  trigger-grade-distribution:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Trigger grade distribution check
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
          SETUP_TOKEN: ${{ secrets.SETUP_TOKEN }}
        run: |
          set -euo pipefail
          echo "Triggering grade distribution check at $(date -u)..."

          HTTP_CODE=""
          BODY=""
          for i in 1 2 3; do
            RESPONSE=$(curl -sS -w "\n%{http_code}" \
              -X POST "${BACKEND_URL}/admin/grade-distribution/check" \
              -H "x-setup-token: ${SETUP_TOKEN}" \
              --max-time 30) || true

            HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
            BODY=$(echo "$RESPONSE" | sed '$d')
            echo "Attempt $i HTTP $HTTP_CODE"
            echo "$BODY"

            [ "$HTTP_CODE" = "200" ] && break
            [ "$i" -lt 3 ] && sleep 30
          done

          [ "$HTTP_CODE" = "200" ] || exit 1
