name: Grade Distribution Check

on:
  schedule:
    # UTC 12:30 = HKT 20:30. Phase 5.0 baseline alert after daily screener data is expected in DB.
    - cron: '30 12 * * *'
  workflow_dispatch:

jobs:
  trigger-grade-distribution:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check grade distribution
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: npm run check-grade-distribution
