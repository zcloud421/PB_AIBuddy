name: Narrative Health Check

on:
  schedule:
    # UTC 01:30 = HKT 09:30, 30 min after attribution health.
    - cron: '30 1 * * *'
  workflow_dispatch:

jobs:
  trigger-narrative-health:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger narrative health
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
          SETUP_TOKEN: ${{ secrets.SETUP_TOKEN }}
        run: |
          set -euo pipefail
          echo "Triggering narrative health at $(date -u)..."

          RESPONSE=$(curl -sS -w "\n%{http_code}" \
            -X POST "${BACKEND_URL}/narrative-health/check" \
            -H "x-setup-token: ${SETUP_TOKEN}" \
            --max-time 30)

          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          echo "HTTP $HTTP_CODE"
          echo "$BODY"

          if [ "$HTTP_CODE" != "202" ] && [ "$HTTP_CODE" != "200" ]; then
            echo "❌ Trigger failed"
            exit 1
          fi

          echo "✅ Narrative health triggered (running async on backend)"
