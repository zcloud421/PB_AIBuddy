name: Gate Distribution Check

on:
  schedule:
    # UTC 12:45 = HKT 20:45, after daily screener and grade distribution.
    - cron: '45 12 * * *'
  workflow_dispatch:

jobs:
  trigger-gate-distribution:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check gate distribution
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -euo pipefail
          npm run check-gate-distribution
