# Fly.io configuration for Josan backend (main API).
#
# Migrated from Railway 2026-05-20 after Railway GCP outage.
# Cron jobs (daily-screener, macro-regime, attrib-health) NOT in this app —
# they run via GitHub Actions calling the API endpoints on this Fly app.
# See .github/workflows/cron-*.yml for cron triggers.

app = "josan-backend"
primary_region = "iad"  # US East (Polygon / FRED / CNN F&G are all US-based)

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "3000"
  # 512MB 机器上 V8 默认老生代堆限太低,daily screener(53 标的全量循环)在
  # 2026-08-04/05 连续两晨以 exit 134(JS heap OOM abort)崩死,run 卡在
  # 'running'。显式给到 400MB,留 ~112MB 给进程其余部分。
  NODE_OPTIONS = "--max-old-space-size=400"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "30s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
  processes = ["app"]

[processes]
  app = "npm start"
